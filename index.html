<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website Telah Pindah</title>
<link rel="icon" href="https://nbmindonesia.github.io/favicon.ico">
<meta name="robots" content="noindex">
  
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f5f5f5;
color:#222;
padding:20px;
text-align:center;
}

.container{
max-width:600px;
}

.logo{
width:180px;
margin-bottom:30px;
}

h1{
font-size:36px;
margin-bottom:15px;
}

p{
font-size:18px;
line-height:1.7;
color:#666;
margin-bottom:20px;
}

.new-url{
display:inline-block;
padding:14px 22px;
background:#111;
color:#fff;
text-decoration:none;
border-radius:8px;
font-weight:bold;
margin-top:10px;
}

.loader{
margin:35px auto 20px;
width:42px;
height:42px;
border:4px solid #ddd;
border-top:4px solid #111;
border-radius:50%;
animation:spin .8s linear infinite;
}

small{
display:block;
margin-top:15px;
color:#888;
}

@keyframes spin{

to{
transform:rotate(360deg);
}

}
</style>

<script>

setTimeout(()=>{
window.location.replace("https://nbmindonesia.github.io/");
},5000);
  
</script>
</head>

<body>
<div class="container">

<img
class="logo"
src="https://nbmindonesia.github.io/assets/img/icons/newsbackmedia.jpeg"
alt="NBM Indonesia">

<h1>Website Telah Pindah</h1>

<p>
Website <strong>news-back-media</strong> telah berpindah ke alamat baru agar
lebih mudah diakses dan memberikan pengalaman yang lebih baik.
</p>

<a
class="new-url"
href="https://nbmindonesia.github.io/">
Kunjungi NBM Indonesia
</a>

<div class="loader"></div>

<small>
Anda akan dialihkan otomatis dalam 5 detik.
</small>
</div>

</body>
</html>
